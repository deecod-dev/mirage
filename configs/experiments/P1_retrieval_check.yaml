# Fast pre-flight for the retrieval fix. Confirms that consolidation actually
# filters and that natural retrieval failures now occur, BEFORE paying for E3/E4.
# Expect natural_retrieval_failure_rate to be well above 0; if it is still 0.0,
# stop and lower answer_top_k rather than launching the full run.
experiment_id: P1_retrieval_check
stage: E1
runtime: server
partition: validation
max_examples: 40
top_k: 5
answer_top_k: 2
batch_size: 32
injector_tiers: [T0]
bootstrap_repeats: 1000
checkpoint_every: 25
max_job_hours: 1.0
